server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: xregion
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:cloud}
  devtools:
    restart:
      enabled: false
  main:
    banner-mode: console

# AWS Direct Cloud Credentials (reads from environment variables)
aws:
  region: ${AWS_REGION:ap-southeast-2}
  accessKeyId: ${AWS_ACCESS_KEY_ID:}
  secretAccessKey: ${AWS_SECRET_ACCESS_KEY:}

# DynamoDB Live Cloud Configuration via Table ARN
dynamodb:
  instancesTableArn: ${DYNAMODB_INSTANCES_TABLE_ARN:arn:aws:dynamodb:ap-southeast-2:291634989063:table/XRegion-Instances}
  migrationsTableArn: ${DYNAMODB_MIGRATIONS_TABLE_ARN:arn:aws:dynamodb:ap-southeast-2:291634989063:table/XRegion-Migrations}
  usersTableArn: ${DYNAMODB_USERS_TABLE_ARN:arn:aws:dynamodb:ap-southeast-2:291634989063:table/XRegion-Users}
  endpoint: ${DYNAMODB_ENDPOINT:}

# Security Configuration (JWT)
jwt:
  secret: ${JWT_SECRET:XRegionEnterpriseSecretKeyWithAtLeast256BitsLengthForSecureHMACSHA256Tokens}
  expirationHours: ${JWT_EXPIRATION_HOURS:24}

logging:
  level:
    root: INFO
    com.iaas.xregion: DEBUG
    software.amazon.awssdk: INFO
