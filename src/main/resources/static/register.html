<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản — XRegion Cloud Console</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/pages/auth-shared.css">
  <link rel="stylesheet" href="/css/pages/register.css">
</head>
<body class="xr-cyber-body">

  <!-- Cyberpunk Tech Grid & Horizon Glow Layers -->
  <div class="cyber-grid-overlay"></div>
  <div class="cyber-glow-layer"></div>

  <!-- Top Header -->
  <header class="xr-top-bar">
    <div class="xr-brand">
      <img src="/img/logo.svg" alt="XRegion EC2" style="height: 28px;">
      <span class="xr-brand-sub" data-i18n="brandSubtitle">Hệ Thống Quản Trị Máy Ảo Đa Vùng</span>
    </div>

    <div class="xr-lang-switch" title="Chọn ngôn ngữ / Select Language">
      <svg class="ico ico-sm" aria-hidden="true"><use href="/img/icons/sprite.svg#ui-globe"></use></svg>
      <select id="xrLangSelect" onchange="setGlobalLang(this.value)">
        <option value="vi">Tiếng Việt (VN)</option>
        <option value="en">English (US)</option>
      </select>
    </div>
  </header>

  <!-- Main 2-Column Wrapper -->
  <main class="xr-main-wrapper" style="grid-template-columns: minmax(0, 460px); justify-content: center;">
    <!-- Left Column: Sign up Form -->
    <div class="xr-card">
      <h1 class="xr-card-title" data-i18n="regHeading">Đăng ký người dùng</h1>
      <p class="xr-card-subtitle" data-i18n="regSubheading">
        Tạo tài khoản mới để khởi tạo và quản lý máy ảo của riêng bạn
      </p>

      <!-- Error Alert Box -->
      <div id="registerErrorBox" class="xr-error-alert"></div>

      <form id="authRegisterForm" onsubmit="handleRegisterPageSubmit(event)">
        <div class="xr-field-group">
          <label class="xr-label" for="regUsername" data-i18n="labelUsername">Tên đăng nhập *</label>
          <input type="text" class="xr-input" id="regUsername" required data-i18n-placeholder="placeholderUsername" placeholder="VD: alex_dev" autocomplete="username">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="xr-field-group" style="margin-bottom: 6px;">
            <label class="xr-label" for="regPassword" data-i18n="labelPassword">Mật khẩu *</label>
            <input type="password" class="xr-input" id="regPassword" required placeholder="••••••••" autocomplete="new-password">
          </div>
          <div class="xr-field-group" style="margin-bottom: 6px;">
            <label class="xr-label" for="regConfirmPassword" data-i18n="labelConfirmPassword">Nhập lại mật khẩu *</label>
            <input type="password" class="xr-input" id="regConfirmPassword" required placeholder="••••••••" autocomplete="new-password">
          </div>
        </div>

        <div class="xr-checkbox-row">
          <label class="xr-checkbox-label">
            <input type="checkbox" onchange="toggleShowRegPasswords(this.checked)">
            <span data-i18n="showPassword">Hiển thị mật khẩu</span>
          </label>
        </div>

        <button type="submit" id="regBtn" class="xr-btn-orange" data-i18n="createBtn">
          Đăng ký tài khoản
        </button>

        <div class="xr-divider">
          <span data-i18n="orDivider">Đã có tài khoản?</span>
        </div>

        <a href="/login.html" class="xr-btn-outline" data-i18n="signInExistingBtn">
          Quay lại đăng nhập
        </a>
      </form>
    </div>
  </main>

  <footer class="xr-footer">
    <span>© 2026 XRegion Cloud Platform</span>
    <a href="javascript:void(0)" data-i18n="footerPrivacy">Bảo mật</a>
    <a href="javascript:void(0)" data-i18n="footerTerms">Điều khoản sử dụng</a>
    <a href="javascript:void(0)" onclick="setGlobalLang(getLang() === 'vi' ? 'en' : 'vi')" data-i18n="footerSwitchLang">
      Switch to English
    </a>
  </footer>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/core/ui.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/session.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/pages/register.js"></script>
</body>
</html>
